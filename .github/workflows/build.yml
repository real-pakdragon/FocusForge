name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow pyinstaller

      - name: Regenerate icon
        run: python tools/make_icon.py

      - name: Smoke test
        run: python tests/smoke_test.py

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name FocusForge --icon assets/icon.ico
          --add-data "assets/icon.ico;assets"
          --version-file assets/version_info.txt
          src/app.py

      - uses: actions/upload-artifact@v4
        with:
          name: FocusForge-windows
          path: dist/FocusForge.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pillow pyinstaller

      - name: Regenerate icon
        run: python tools/make_icon.py

      - name: Smoke test
        run: xvfb-run -a python tests/smoke_test.py

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name FocusForge
          --add-data "assets/icon.ico:assets"
          --add-data "assets/logo.png:assets"
          src/app.py

      - uses: actions/upload-artifact@v4
        with:
          name: FocusForge-linux
          path: dist/FocusForge
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow pyinstaller

      - name: Regenerate icon
        run: python tools/make_icon.py

      - name: Smoke test
        run: python tests/smoke_test.py

      - name: Build app bundle
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name FocusForge
          --add-data "assets/icon.ico:assets"
          --add-data "assets/logo.png:assets"
          src/app.py

      - uses: actions/upload-artifact@v4
        with:
          name: FocusForge-macos
          path: dist/FocusForge.app
          if-no-files-found: error
